[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "murayama-recon-toolkit"
version = "0.1.0"
description = "Modular cybersecurity reconnaissance toolkit"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "dnspython==2.8.0",
    "requests"
]

[project.scripts]
murayama-recon = "recon.app:main"

[tool.setuptools]
packages = ["recon"]